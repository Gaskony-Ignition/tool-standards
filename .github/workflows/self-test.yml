name: self-test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: python3 tests/run.py
      - name: shellcheck
        run: |
          if command -v shellcheck >/dev/null; then shellcheck gate/lint-gate.sh
          else echo "shellcheck not on this runner image - skipped"; fi
